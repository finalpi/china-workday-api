version: '3'
services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  china-workday-api:
    image: finalpi/china-workday-api:latest
    ports:
      - "10033:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DATABASE=0
    depends_on:
      - redis
    restart: always

volumes:
  redis_data: